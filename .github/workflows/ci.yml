name: CI

on:
  push:
    branches: [main, mathsexpress-v2]
  pull_request:
    branches: [main, mathsexpress-v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Secrets, format, lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so every commit on the branch can be scanned for credentials.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for committed credentials
        run: |
          node scripts/check-secrets.ts --all
          node scripts/check-secrets.ts --commits origin/main..HEAD

      - name: Run all checks
        run: npm run check

      - name: Diagnose and format shop changes
        if: failure()
        run: |
          npx prettier --write CLAUDE.md docs/architecture.md src/data src/domain src/features/shop src/features/learning/GuidedLessonPage.tsx src/features/side-panels src/layouts src/test/fakeDependencies.ts tests/db/shop.test.ts
          for file in CLAUDE.md docs/architecture.md src/data/supabase/supabaseShopRepository.ts src/domain/shop.ts src/features/learning/GuidedLessonPage.tsx src/features/shop/ShopPage.module.css src/features/shop/ShopPage.tsx src/features/shop/ShopPreview.module.css src/features/shop/ShopPreview.tsx src/features/side-panels/SidePanelContents.tsx src/features/side-panels/SidePanelToolbar.test.tsx src/features/side-panels/SidePanelToolbar.tsx src/layouts/AccountMenu.module.css src/layouts/student/StudentLayout.tsx src/test/fakeDependencies.ts tests/db/shop.test.ts; do
            echo "SHOP_FORMAT_START:$file"
            base64 -w0 "$file"
            echo
            echo "SHOP_FORMAT_END:$file"
          done
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  database:
    name: Database and authentication tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Start a local Supabase stack and apply the migrations
        run: supabase start

      - name: Check the generated database types match the migrations
        run: |
          npm run --silent db:types
          git diff --exit-code src/data/supabase/database.types.ts

      - name: Run the database and authentication tests
        run: npm run test:db
