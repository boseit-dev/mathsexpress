name: CI

on:
  push:
    branches: [main, mathsexpress-v2]
  pull_request:
    branches: [main, mathsexpress-v2]

permissions:
  contents: read

concurrency:
  group: ci-textbook-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Secrets, format, lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so every commit on the branch can be scanned for credentials.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for committed credentials
        run: |
          node scripts/check-secrets.ts --all
          node scripts/check-secrets.ts --commits origin/main..HEAD

      - name: Show final textbook lint-fix formatting
        run: |
          npx prettier --write src/features/textbook/NotebookExploration.tsx src/features/textbook/StructuredNotebookChapter.tsx src/features/textbook/TextbookPage.test.tsx
          git diff -- src/features/textbook/NotebookExploration.tsx src/features/textbook/StructuredNotebookChapter.tsx src/features/textbook/TextbookPage.test.tsx

      - name: Run all checks
        run: npm run check

  database:
    name: Database and authentication tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Start a local Supabase stack and apply the migrations
        run: supabase start

      - name: Check the generated database types match the migrations
        run: |
          npm run --silent db:types
          git diff --exit-code src/data/supabase/database.types.ts

      - name: Run the database and authentication tests
        run: npm run test:db

  deploy_cloudflare_v2:
    name: Deploy tested V2 updates to Cloudflare
    needs: [checks, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/mathsexpress-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: cloudflare-v2-worker
      cancel-in-progress: false
    steps:
      - name: Check V2 hosting settings
        id: hosting
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_V2_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_V2_ACCOUNT_ID }}
          V2_URL: ${{ vars.V2_SUPABASE_URL }}
          V2_KEY: ${{ vars.V2_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" || -z "$V2_URL" || -z "$V2_KEY" ]]; then
            echo "::warning::V2 auto-deploy not activated yet. See docs/cloudflare-auto-deploy.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$V2_URL" == *"dsjrxkxjcaurrbijihja"* ]]; then
            echo "::error::Do not connect V2 to the old production Supabase database."
            exit 1
          fi
          if [[ ! "$V2_URL" =~ ^https://[a-z0-9]+[.]supabase[.]co/?$ ]]; then
            echo "::error::V2_SUPABASE_URL must be a hosted Supabase HTTPS URL."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check out tested commit
        if: steps.hosting.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.hosting.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned dependencies
        if: steps.hosting.outputs.ready == 'true'
        run: npm ci

      - name: Verify target and build V2
        if: steps.hosting.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.V2_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.V2_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module -e "import {readWranglerConfig} from './scripts/lib/deploy-config.ts'; const c=readWranglerConfig('wrangler.jsonc'); if (c.name !== 'mathsexpress-v2' || c.routes || c.route) process.exit(1)"
          npm run build

      - name: Deploy only to mathsexpress-v2
        if: steps.hosting.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_V2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_V2_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
